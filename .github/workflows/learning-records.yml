name: 学習時間を取得

on:
  workflow_dispatch:
  schedule:
    # UTC 6〜13時 = 日本時間15〜22時。混雑を避けて毎時17分。
    - cron: '17 6-13 * * *'

concurrency:
  group: smile-zemi-learning-records
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    # 公開ウィザードが作る複製では取得しない。データの取得元はこのリポジトリだけ。
    if: github.repository == 'ryujiro/yutagame'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: 取得環境を準備
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: 学習時間を1回取得
        env:
          SMILE_ZEMI_LOGIN_ID: ${{ secrets.SMILE_ZEMI_LOGIN_ID }}
          SMILE_ZEMI_PASSWORD: ${{ secrets.SMILE_ZEMI_PASSWORD }}
        run: python scripts/update_public_data.py
      - name: 公開用の記録だけを保存
        if: ${{ always() }}
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git add -- public-data/dashboard.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update saved learning records'
            git push origin "HEAD:$TARGET_BRANCH"
          fi
